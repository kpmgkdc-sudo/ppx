<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Web CAT Studio — .sdlppx / .sdlxliff 移动与桌面端编辑器</title>
  <!-- 多源容灾加载 JSZip，防止单一海外 CDN 被拦截导致脚本崩溃 -->
  <script src="https://cdn.bootcdn.net/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    if (typeof JSZip === 'undefined') {
      document.write('<script src="https://cdn.staticfile.net/jszip/3.10.1/jszip.min.js"><\/script>');
    }
  </script>
  <script>
    if (typeof JSZip === 'undefined') {
      document.write('<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"><\/script>');
    }

  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0b1220;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --tag-bg: rgba(59, 130, 246, 0.18);
      --tag-border: rgba(96, 165, 250, 0.5);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 88px;
    }
    /* 全局错误提示条 */
    #errorBanner {
      display: none;
      background: #7f1d1d;
      color: #fecaca;
      padding: 10px 14px;
      font-size: 13px;
      border-bottom: 1px solid #ef4444;
      word-break: break-all;
    }
    /* 顶部导航与工具栏 */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .brand {
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.35);
    }
    .toolbar {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    button, .file-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    button:active, .file-btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-success {
      background: var(--success);
      border-color: var(--success);
      color: #052e16;
      font-weight: 700;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      padding: 8px 14px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      gap: 8px;
      flex-wrap: wrap;
    }
    /* 主编辑区 */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px;
    }
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.45);
      margin-top: 16px;
    }
    .empty-state h2 { margin: 0 0 8px; font-size: 18px; }
    .empty-state p { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .empty-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    /* 句段卡片（手机上下堆叠，桌面左右对照） */
    .segment-list { display: flex; flex-direction: column; gap: 12px; }
    .seg-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      transition: border-color 0.15s;
    }
    .seg-card.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }
    .seg-card.confirmed {
      border-left: 4px solid var(--success);
    }
    .seg-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .seg-status {
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
    }
    .st-untranslated { background: rgba(148,163,184,0.15); color: #cbd5e1; }
    .st-draft { background: rgba(245,158,11,0.18); color: #fbbf24; }
    .st-confirmed { background: rgba(16,185,129,0.2); color: #34d399; }

    .seg-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 900px) {
      .seg-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
    }
    .source-box {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
    }
    .tag-pill {
      display: inline-block;
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      color: #93c5fd;
      border-radius: 4px;
      padding: 0 5px;
      margin: 0 2px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .target-box {
      width: 100%;
      min-height: 76px;
      background: #090e1a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 15px;
      line-height: 1.6;
      resize: vertical;
      font-family: inherit;
    }
    .target-box:focus {
      outline: none;
      border-color: var(--primary);
    }
    .card-quick-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }
    .card-quick-actions button { padding: 6px 10px; font-size: 12px; }

    /* 手机底部常驻触控工作栏 */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(15, 23, 42, 0.98);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

      flex: 1;
      padding:
